name: fetch-oldest-three-transcripts

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-oldest-three.mjs"
      - ".github/workflows/fetch-oldest-three.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-oldest-three.mjs
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oldest-three-transcripts.json
          git diff --cached --quiet || git commit -m "data: add oldest three transcripts"
          git push
