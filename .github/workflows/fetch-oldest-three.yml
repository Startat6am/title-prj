name: fetch-oldest-three-transcripts

on:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-oldest-three.mjs"
      - ".github/workflows/fetch-oldest-three.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-oldest-three.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: oldest-three-transcripts
          path: oldest-three-transcripts.json
          retention-days: 7
